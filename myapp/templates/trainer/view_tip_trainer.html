<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fitness Tips</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#111;
            color:white;
            font-family:Arial, sans-serif;
        }

        .container{
            margin-top:50px;
        }

        .card{
            background:#1c1c1c;
            border-radius:20px;
            padding:25px;
            margin-bottom:20px;
            box-shadow:0 0 15px rgba(0,255,100,0.3);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 0 25px rgba(0,255,100,0.6);
        }

        h1{
            color:#00ff88;
            text-align:center;
            margin-bottom:40px;
        }

        .date{
            color:#aaa;
            font-size:14px;
        }

        .tip-text{
            font-size:18px;
            line-height:1.6;
        }

        .btn-add{
            background:#00ff88;
            color:black;
            border-radius:25px;
            padding:10px 25px;
            text-decoration:none;
            font-weight:bold;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>🏋️ My Fitness Tips</h1>

    <div class="text-end mb-4">
        <a href="/myapp/add_tip/" class="btn-add">
            + Add New Tip
        </a>
    </div>


   {% for i in tips %}

<div class="card">

    <div class="tip-text">
        {{i.tip}}
    </div>

    <hr>

    <div class="date">
        📅 {{i.date}}
    </div>

    <div class="mt-3">

        <a href="/myapp/edit_tip/{{i.id}}" 
           class="btn btn-warning btn-sm rounded-pill px-4">
            ✏ Edit
        </a>

        <a href="/myapp/delete_tip/{{i.id}}" 
           class="btn btn-danger btn-sm rounded-pill px-4"
           onclick="return confirm('Are you sure you want to delete this tip?')">
            🗑 Delete
        </a>

    </div>

</div>

{% empty %}

<div class="text-center">
    <h4>No Tips Added Yet</h4>
</div>

{% endfor %}


</div>

</body>
</html>
