<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Fitness Tip</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .tip-card{
            width:100%;
            max-width:650px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px);
            border-radius:20px;
            padding:35px;
            color:white;
            box-shadow:0 15px 35px rgba(0,0,0,.4);
            border:1px solid rgba(255,255,255,.15);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            font-weight:700;
            color:#00e5ff;
        }

        label{
            font-weight:600;
            margin-bottom:8px;
        }

        textarea{
            resize:none;
            height:220px;
            border-radius:12px !important;
            border:none !important;
            padding:15px !important;
            background:rgba(255,255,255,.9) !important;
        }

        textarea:focus{
            box-shadow:0 0 10px #00e5ff !important;
        }

        .btn-save{
            background:#00c853;
            color:white;
            width:100%;
            padding:12px;
            font-size:18px;
            font-weight:bold;
            border:none;
            border-radius:12px;
            transition:.3s;
        }

        .btn-save:hover{
            background:#00a844;
            transform:translateY(-2px);
        }

        .btn-back{
            width:100%;
            margin-top:12px;
            border-radius:12px;
            font-weight:600;
        }

        .icon{
            font-size:45px;
            text-align:center;
            display:block;
            margin-bottom:10px;
        }
    </style>
</head>
<body>

<div class="tip-card">

    <div class="icon">💡</div>

    <h2>Edit Tip</h2>

    <form id="form">
        {% csrf_token %}

        <div class="mb-4">
             <input
        type="date"
        name="date"
        id="date"
        class="form-control"
        value="{% now 'Y-m-d' %}"
        required>
        
            <label>Fitness Tip</label>
            <textarea name="tip" id="tip" class="form-control" placeholder="Enter today's fitness tip..." required>{{tip.tip}}</textarea>
        </div>
        
        <button type="submit" class="btn btn-save">
            Save Tip
        </button>

        <a href="#" class="btn btn-outline-light btn-back">
            Back
        </a>

    </form>

</div>
<script>
   $(document).ready(function(){

    $("#form").submit(function(e){
        e.preventDefault();

        let tip = $("#tip").val();
        let date = $("#date").val();
        let token = $('input[name=csrfmiddlewaretoken]').val();

        $.ajax({
            url:'/myapp/add_tip_post/',
            method:'POST',
            data:{
                'tip': tip,
                'date': date,
                'csrfmiddlewaretoken': token,
            },

            success:function(response){

                if(response.status == "ok"){
                    alert('Tip edited successfully');
                    window.location.href = "/myapp/view_tip_trainer/";
                }
                else{
                    alert('Something went wrong');
                }
            },

            error:function(){
                alert("Server error");
            }
        });

    });

});
</script>
</body>
</html>
