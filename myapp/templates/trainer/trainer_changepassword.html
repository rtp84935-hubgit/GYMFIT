<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Change Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f766e);
        }

        .password-card {
            width: 420px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .35);
            color: #fff;
        }

        .password-card h2 {
            text-align: center;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .password-card p {
            text-align: center;
            color: #d1d5db;
            margin-bottom: 25px;
        }

        .form-label {
            color: #fff;
            font-weight: 500;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .25);
            color: #fff;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, .15);
            color: #fff;
            border-color: #22c55e;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #d1d5db;
        }

        .btn-change {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            transition: .3s;
        }

        .btn-change:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #d1d5db;
            text-decoration: none;
        }

        .back-link:hover {
            color: #22c55e;
        }

        .icon {
            width: 70px;
            height: 70px;
            background: #22c55e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }
    </style>
</head>

<body>

    <div class="password-card">

        <div class="icon">
            🔒
        </div>

        <h2>Change Password</h2>
        <p>Update your account password securely</p>
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        <form id="form" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-control" name="current_password" id="current_password"
                    placeholder="Enter current password">
                                <span id="msg" style="color: red;"></span>

            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" name="new_password" id="new_password"
                    placeholder="Enter new password">
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" name="confirm_password" id="confirm_password"
                    placeholder="Confirm new password">
                                <span id="msg1" style="color: red;"></span>

            </div>

            <button class="btn btn-change" id="submitt">
                Change Password
            </button>

        </form>

        <a href="/myapp/admin_home/" class="back-link">← Back to Home</a>

    </div>
    <script>
        $(document).ready(function () {
            $('#form').submit(function (e) {
                e.preventDefault()
                let current_password = $("#current_password").val();
                let new_password = $("#new_password").val();
                let confirm_password = $("#confirm_password").val();
                let token=$('input[name=csrfmiddlewaretoken]').val()
                console.log(current_password)
                $.ajax({
                    
                    url:'/myapp/admin_changepassword_post/',
                    method:'POST',
                    data:{
                        'current_password':current_password,
                        'new_password':new_password,
                        'confirm_password':confirm_password,
                        'csrfmiddlewaretoken':token
                    },success:function(response){
                        if (response.status == 'currentpassno'){
                            $("#msg").html('current password is incorrect!')
                        }
                        else if(response.status == 'nomatch'){
                            $("#msg1").html('newpassword doesnt match!')

                        }
                        else{
                            alert('password changed successfully')
                            window.location.href = '/myapp/trainer_changepassword/';

                        }
                    }
                })

            })
        })
    </script>
</body>

</html>
