<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Clients</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
            font-family:'Segoe UI',sans-serif;
        }

        .header{
            background:linear-gradient(135deg,#0d6efd,#6610f2);
            color:white;
            padding:35px;
            text-align:center;
            margin-bottom:40px;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        .client-card{
            border:none;
            border-radius:20px;
            overflow:hidden;
            transition:.3s;
            box-shadow:0 8px 20px rgba(0,0,0,.1);
        }

        .client-card:hover{
            transform:translateY(-8px);
            box-shadow:0 15px 30px rgba(13,110,253,.25);
        }

        .avatar{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#0d6efd;
            color:white;
            font-size:35px;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:25px auto 15px;
            font-weight:bold;
        }

        .client-name{
            font-size:24px;
            font-weight:bold;
        }

        .info{
            font-size:15px;
            color:#555;
            margin-bottom:8px;
        }

        .btn-custom{
            border-radius:25px;
            padding:8px 20px;
        }

        .search-box{
            max-width:450px;
            margin:auto;
            margin-bottom:35px;
        }

    </style>

</head>

<body>

<div class="header">

    <h2>👥 Gym Members</h2>

    <p>View All Registered Clients</p>

</div>

<div class="container">

    <div class="search-box">

        <input type="text"
               class="form-control form-control-lg"
               placeholder="Search Client...">

    </div>

    <div class="row g-4">

        {% for i in client %}

        <div class="col-lg-4 col-md-6">

            <div class="card client-card">

                <div class="avatar">
                    {{ i.cname|slice:":1"|upper }}
                </div>

                <div class="card-body text-center">

                    <div class="client-name">
                        {{ i.cname }}
                    </div>

                    <hr>

                    <p class="info">
                        <strong>Age :</strong> {{ i.cage }}
                    </p>

                    <p class="info">
                        <strong>Place :</strong> {{ i.cplace }}
                    </p>

                    <p class="info">
                        <strong>Email :</strong> {{ i.cemail }}
                    </p>

                    <div class="mt-4">

                        <a href="#" class="btn btn-primary btn-custom">
                            View Profile
                        </a>

                        <a href="#" class="btn btn-danger btn-custom">
                            Remove
                        </a>

                    </div>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="col-12 text-center">

            <h3>No Clients Found</h3>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
