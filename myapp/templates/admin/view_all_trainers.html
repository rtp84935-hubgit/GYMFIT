<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Trainers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
            font-family:'Segoe UI',sans-serif;
        }

        .page-title{
            background:linear-gradient(135deg,#0d6efd,#0b5ed7);
            color:white;
            padding:25px;
            text-align:center;
            font-weight:bold;
            margin-bottom:40px;
        }

        .trainer-card{
            border:none;
            border-radius:18px;
            overflow:hidden;
            transition:.3s;
            box-shadow:0 8px 20px rgba(0,0,0,.1);
        }

        .trainer-card:hover{
            transform:translateY(-8px);
            box-shadow:0 15px 35px rgba(13,110,253,.25);
        }

        .trainer-img{
            height:250px;
            object-fit:cover;
            width:100%;
        }

        .spec{
            background:#0d6efd;
            color:white;
            padding:5px 15px;
            border-radius:20px;
            display:inline-block;
            font-size:14px;
        }

        .card-body p{
            margin-bottom:8px;
            color:#555;
        }

        .btn-custom{
            border-radius:30px;
            padding:8px 20px;
        }
    </style>
</head>

<body>

<div class="page-title">
    <h2>🏋 Our Trainers</h2>
    <p>Professional Fitness Coaches</p>
</div>

<div class="container">

    <div class="row g-4">

        {% for i in trainers %}

        <div class="col-lg-4 col-md-6">

            <div class="card trainer-card">

                <img src="{{ i.photo.url }}" class="trainer-img">

                <div class="card-body text-center">

                    <h3>{{ i.tname }}</h3>

                    <div class="spec mb-3">
                        {{ i.specification }}
                    </div>

                    <p><strong>Age :</strong> {{ i.tage }}</p>

                    <p><strong>Place :</strong> {{ i.tplace }}</p>

                    <p><strong>Email :</strong> {{ i.temail }}</p>

                    <p><strong>Experience :</strong> {{ i.experience }} Years</p>

                    <hr>

                    <div class="d-flex justify-content-center gap-2">

                        <a href="#" class="btn btn-primary btn-custom">
                            View Profile
                        </a>

                        <a href="#" class="btn btn-success btn-custom">
                            Contact
                        </a>
                        <a href="/myapp/reject_approved_trainer/{{i.id}}" class="btn btn-danger btn-custom">
                            Reject
                        </a>

                    </div>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="col-12 text-center">
            <h4>No Trainers Available</h4>
        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
