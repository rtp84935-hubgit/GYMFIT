<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Premium Video</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#0f172a;
    font-family:Arial,Helvetica,sans-serif;
}

.page-title{
    text-align:center;
    color:#fff;
    margin:40px 0;
}

.page-title h2{
    font-weight:bold;
    font-size:38px;
}

.page-title p{
    color:#bdbdbd;
}

.video-card{
    background:#1e293b;
    border-radius:18px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.form-label{
    color:#fff;
    font-weight:600;
}

.form-control,
.form-select{
    background:#334155;
    border:none;
    color:#fff;
}

.form-control:focus,
.form-select:focus{
    background:#334155;
    color:#fff;
    border:1px solid #f59e0b;
    box-shadow:none;
}

.upload-box{
    border:2px dashed #f59e0b;
    border-radius:15px;
    padding:35px;
    text-align:center;
    color:#ddd;
}

.upload-box i{
    font-size:60px;
    color:#f59e0b;
    margin-bottom:15px;
}

.btn-upload{
    background:#f59e0b;
    color:#000;
    font-weight:bold;
    border:none;
    padding:12px;
}

.btn-upload:hover{
    background:#ffb624;
}

</style>

</head>
<body>

<div class="container py-5">

    <div class="page-title">
        <h2><i class="fa-solid fa-crown text-warning"></i> Add Premium Video</h2>
        <p>Upload workout tutorials for premium members.</p>
    </div>

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="video-card">

                <form action="/myapp/add_premium_post/" method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Video Title</label>
                        <input type="text"
                               class="form-control"
                               name="title"
                               placeholder="Enter video title"
                               required>
                    </div>

                    <div class="mb-4">

                        <label class="form-label">Workout Video</label>

                        <div class="upload-box">

                            <i class="fa-solid fa-video"></i>

                            <h5>Choose Video File</h5>

                            <p>Supported: MP4, MOV, AVI</p>

                            <input type="file"
                                   class="form-control mt-3"
                                   name="video"
                                   accept="video/*"
                                   required>

                        </div>

                    </div>

                    <button class="btn btn-upload w-100">

                        <i class="fa-solid fa-upload me-2"></i>

                        Upload Premium Video

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
