<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Trainers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#0f172a,#1e293b);
            font-family: Arial, sans-serif;
            min-height:100vh;
        }

        .container-box{
            margin-top:60px;
            background:white;
            border-radius:20px;
            padding:30px;
            box-shadow:0 15px 35px rgba(0,0,0,.3);
        }

        h2{
            text-align:center;
            font-weight:bold;
            margin-bottom:30px;
            color:#0d6efd;
        }

        table{
            border-radius:15px;
            overflow:hidden;
        }

        thead{
            background:#0d6efd;
            color:white;
        }

        img{
            width:70px;
            height:70px;
            object-fit:cover;
            border-radius:50%;
        }

        .btn{
            border-radius:20px;
            font-size:14px;
            padding:6px 18px;
        }

        tr:hover{
            background:#f5f7fa;
        }

        .badge{
            font-size:14px;
            padding:8px 15px;
        }
    </style>

</head>
<body>

<div class="container">

    <div class="container-box">

        <h2><i class="fa-solid fa-user-check"></i> Verify Trainers</h2>

        <table class="table table-bordered table-hover align-middle text-center">

            <thead>
                <tr>
                    <th>#</th>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Place</th>
                    <th>Email</th>
                    <th>Specification</th>
                    <th>Experience</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

            {% for i in train %}

            <tr>

                <td>{{forloop.counter}}</td>

                <td>
                    <img src="{{i.photo.url}}">
                </td>

                <td>{{i.tname}}</td>

                <td>{{i.tage}}</td>

                <td>{{i.tplace}}</td>

                <td>{{i.temail}}</td>

                <td>{{i.specification}}</td>

                <td>{{i.experience}} Years</td>

                <td>{{i.status}}</td>

              

                <td>

                    

                    <a href="/myapp/verify_trainer/{{i.id}}" class="btn btn-success">
                        <i class="fa-solid fa-check"></i> Verify
                    </a>

             
                    

                


                </td>

            </tr>

            {% empty %}
            <tr>
                <td colspan="10" class="text-center text-danger">
                    No Trainers Found
                </td>
            </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
