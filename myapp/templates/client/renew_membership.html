<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Membership</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#0f172a;
    font-family:Arial,Helvetica,sans-serif;
}

.membership-card{
    background:#1e293b;
    border-radius:20px;
    padding:40px;
    color:#fff;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.plan-badge{
    background:#f59e0b;
    color:#000;
    padding:8px 18px;
    border-radius:30px;
    font-weight:bold;
    display:inline-block;
    margin-bottom:20px;
}

.plan-title{
    font-size:40px;
    font-weight:bold;
}

.plan-price{
    font-size:55px;
    font-weight:bold;
    color:#fbbf24;
}

.plan-price span{
    font-size:22px;
    color:#ddd;
}

.feature-list{
    list-style:none;
    padding:0;
}

.feature-list li{
    margin:15px 0;
    font-size:17px;
}

.feature-list i{
    color:#22c55e;
    margin-right:10px;
}

.duration-select{
    width:100%;
    background:#334155;
    border:none;
    color:#fff;
    padding:12px;
    border-radius:10px;
}

.duration-select:focus{
    outline:none;
    border:1px solid #f59e0b;
}

.btn-premium{
    background:#f59e0b;
    color:#000;
    border:none;
    font-weight:bold;
    padding:12px;
}

.btn-premium:hover{
    background:#ffb624;
}

</style>

</head>
<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="membership-card">

                <div class="text-center">

                    <span class="plan-badge">
                        <i class="fa-solid fa-crown me-2"></i>
                        Premium Membership
                    </span>

                    <h2 class="plan-title">
                        FITZONE PREMIUM
                    </h2>

                    <div class="plan-price">
                        ₹2,499
                        <span>/month</span>
                    </div>

                    <p class="text-secondary">
                        Unlock exclusive premium fitness benefits.
                    </p>

                </div>

                <hr class="my-4">

                <ul class="feature-list">

                    <li><i class="fa-solid fa-check"></i> Unlimited Gym Access</li>

                    <li><i class="fa-solid fa-check"></i> Premium Workout Videos</li>

                    <li><i class="fa-solid fa-check"></i> Personalized Diet Plans</li>

                    <li><i class="fa-solid fa-check"></i> Weekly Workout Programs</li>

                    <li><i class="fa-solid fa-check"></i> Progress Tracking</li>

                    <li><i class="fa-solid fa-check"></i> Trainer Support</li>

                    <li><i class="fa-solid fa-check"></i> Monthly Fitness Assessment</li>

                </ul>

                <hr class="my-4">

                <form action="/myapp/renew_membership_post/" method="post">

                    {% csrf_token %}

                    <label class="mb-2">
                        <strong>Select Membership Duration</strong>
                    </label>

                    <select id="duration" name="duration" class="duration-select">

                        <option value="3"
                                data-monthly="2499"
                                data-total="7497">
                            3 Months
                        </option>

                        <option value="6"
                                data-monthly="2249"
                                data-total="13494"
                                selected>
                            6 Months — Save 10%
                        </option>

                        <option value="12"
                                data-monthly="1999"
                                data-total="23988">
                            1 Year — Save 20%
                        </option>

                    </select>

                    <button class="btn btn-premium w-100 mt-4">

                        <i class="fa-solid fa-crown me-2"></i>

                        Purchase Premium Membership

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
