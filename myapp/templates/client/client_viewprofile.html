<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b,#0f766e);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .profile-card{
            width:700px;
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:20px;
            overflow:hidden;
            color:white;
            box-shadow:0 15px 35px rgba(0,0,0,.3);
        }

        .profile-header{
            background:linear-gradient(90deg,#16a34a,#22c55e);
            text-align:center;
            padding:35px;
        }

        .profile-header img{
            width:120px;
            height:120px;
            border-radius:50%;
            border:5px solid white;
            object-fit:cover;
            margin-bottom:15px;
        }

        .profile-header h2{
            margin:0;
            font-weight:700;
        }

        .profile-body{
            padding:35px;
        }

        .info-box{
            background:rgba(255,255,255,.08);
            padding:15px 20px;
            border-radius:10px;
            margin-bottom:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .info-box span:first-child{
            font-weight:600;
            color:#22c55e;
        }

        .button-group{
            margin-top:30px;
            display:flex;
            justify-content:center;
            gap:20px;
        }

        .btn-edit{
            background:#22c55e;
            color:white;
            padding:10px 30px;
            border-radius:10px;
            text-decoration:none;
            transition:.3s;
            font-weight:600;
        }

        .btn-edit:hover{
            background:#16a34a;
            color:white;
            transform:translateY(-2px);
        }

        .btn-password{
            background:#0d6efd;
            color:white;
            padding:10px 30px;
            border-radius:10px;
            text-decoration:none;
            transition:.3s;
            font-weight:600;
        }

        .btn-password:hover{
            background:#0b5ed7;
            color:white;
            transform:translateY(-2px);
        }
    </style>
</head>
<body>

<div class="profile-card">

    <div class="profile-header">

        <h2>{{data.cname}}</h2>
        <p>Gym Member</p>

    </div>

    <div class="profile-body">

        <div class="info-box">
            <span>Name</span>
            <span>{{data.cname}}</span>
        </div>

        <div class="info-box">
            <span>Age</span>
            <span>{{data.cage}}</span>
        </div>

        <div class="info-box">
            <span>Place</span>
            <span>{{data.cplace}}</span>
        </div>

        <div class="info-box">
            <span>Email</span>
            <span>{{data.cemail}}</span>
        </div>
        <div class="button-group">
            <a href="/myapp/edit_clientprofile/" class="btn-edit">✏ Edit Profile</a>
            <a href="#" class="btn-password">🔒 Change Password</a>
        </div>

    </div>

</div>

</body>
</html>
