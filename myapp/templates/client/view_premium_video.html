```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Workout Videos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#0f172a;
    font-family:Arial,Helvetica,sans-serif;
}

.section-title{
    text-align:center;
    color:#fff;
    margin:50px 0;
}

.section-title h2{
    font-size:40px;
    font-weight:bold;
}

.section-title p{
    color:#94a3b8;
}

.video-card{
    background:#1e293b;
    border-radius:18px;
    overflow:hidden;
    transition:.3s;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.video-card:hover{
    transform:translateY(-8px);
}

.video-card video{
    width:100%;
    height:230px;
    object-fit:cover;
    background:#000;
}

.video-body{
    padding:20px;
}

.video-title{
    color:#fff;
    font-size:22px;
    font-weight:bold;
}

.video-category{
    color:#fbbf24;
    margin-bottom:10px;
}

.video-date{
    color:#94a3b8;
    font-size:14px;
}

.watch-btn{
    background:#f59e0b;
    color:#000;
    border:none;
    font-weight:bold;
    width:100%;
    margin-top:15px;
}

.watch-btn:hover{
    background:#ffb624;
}

.empty-box{
    background:#1e293b;
    border-radius:15px;
    padding:60px;
    text-align:center;
    color:#fff;
}

.empty-box i{
    font-size:70px;
    color:#f59e0b;
    margin-bottom:20px;
}

</style>

</head>
<body>

<div class="container py-5">

    <div class="section-title">
        <h2>
            <i class="fa-solid fa-crown text-warning"></i>
            Premium Workout Videos
        </h2>

        <p>Exclusive workout tutorials available only for premium members.</p>
    </div>

    <div class="row">

        {% for i in premium %}

        <div class="col-lg-4 col-md-6 mb-4">

            <div class="video-card">

                <video controls controlsList="nodownload">
                    <source src="{{ i.video.url }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>

                <div class="video-body">

                    <h4 class="video-title">
                        {{ i.title }}
                    </h4>

                    <p class="video-category">
                        <i class="fa-solid fa-dumbbell"></i>
                        {{ i.category }}
                    </p>

                    <p class="video-date">
                        <i class="fa-solid fa-calendar"></i>
                        {{ i.date }}
                    </p>

                    <button class="btn watch-btn">
                        <i class="fa-solid fa-play me-2"></i>
                        Watch Video
                    </button>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="col-12">

            <div class="empty-box">

                <i class="fa-solid fa-video-slash"></i>

                <h3>No Premium Videos Available</h3>

                <p>New workout tutorials will be added soon.</p>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
