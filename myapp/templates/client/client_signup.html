<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Signup</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>


    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .signup-box{
            width:420px;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,.2);
        }

        .signup-box h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
            color:#555;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            transition:.3s;
        }

        .input-group input:focus{
            border-color:#4facfe;
            box-shadow:0 0 8px rgba(79,172,254,.4);
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#4facfe;
            color:#fff;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            background:#2196f3;
        }

        .login-link{
            text-align:center;
            margin-top:15px;
        }

        .login-link a{
            text-decoration:none;
            color:#2196f3;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="signup-box">

    <h2>Client Signup</h2>

    <form method="post" id="form" >
        {%csrf_token%}


        <div class="input-group">
            <label>Name</label>
            <input type="text" name="cname" id="cname" placeholder="Enter your name">
        </div>

        <div class="input-group">
            <label>Age</label>
            <input type="number" name="cage" id="cage" placeholder="Enter your age">
        </div>

        <div class="input-group">
            <label>Place</label>
            <input type="text" name="cplace" id="cplace" placeholder="Enter your place">
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="cemail"  id="cemail" placeholder="Enter your email">
            <p id="msg" style="color: red;"></p>
        </div>



        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" id="password" placeholder="Create a password">
            <p id="pmsg" style="color: red;"></p>
        </div>

        <button type="submit" class="btn">Sign Up</button>

        <div class="login-link">
            Already have an account?
            <a href="/myapp/login/">Login</a>
        </div>

    </form>

</div>
<script>
    $(document).ready(function(){
        $('#cemail').keyup(function(){
            $.ajax({
                url:'/myapp/check_username_client/',
                method:'GET',
                data:{
                    'username':$('#cemail').val()
                },success:function(response){
                    if (response.status=='yes'){
                        alert('hello')
                        $('#msg').html('username already exists..!')
                        
                    }
                    else{
                        $('#msg').html(' ')
                    }
                }
            })
        })
        $('#form').submit(function(e){
            e.preventDefault()
            let name=$('#cname').val()
            let age=$('#cage').val()
            let place=$('#cplace').val()
            let password=$('#password').val()
            let username=$('#cemail').val()
            let token=$('input[name=csrfmiddlewaretoken]').val()
            $.ajax({
                url:'/myapp/client_signup_post/',
                method:'POST',
                data:{
                    'cname':name,
                    'cage':age,
                    'cplace':place,
                    'cemail':username,
                    'password':password,
                    'csrfmiddlewaretoken':token,
                },success:function(response){
                    if (response.status=='yes'){
                        alert('signed in succcessfully')
                        window.location.href = '/myapp/login/';

                    }
                    else{
                        alert('something went wrong')
                    }
                }
            })


        })
        $('#password').keyup(function(){
            let pass=$('#password').val()
            let count=pass.length;
            if (count<8){
                $('#pmsg').html('password must have minimum 8 charecters')
            }
            else{
                $('#pmsg').html(' ')
            }
        })
    })
</script>



</body>
</html>
