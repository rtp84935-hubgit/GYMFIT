<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitZone - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    background:#0d0d0d;
    position:relative;
}

/* Animated Background */

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#ff1e1e;
    border-radius:50%;
    filter:blur(170px);
    top:-180px;
    left:-120px;
    animation:move1 8s infinite alternate;
}

body::after{
    content:'';
    position:absolute;
    width:450px;
    height:450px;
    background:#ff7300;
    border-radius:50%;
    filter:blur(170px);
    bottom:-180px;
    right:-120px;
    animation:move2 8s infinite alternate;
}

@keyframes move1{
from{transform:translateY(0);}
to{transform:translateY(100px);}
}

@keyframes move2{
from{transform:translateY(0);}
to{transform:translateY(-100px);}
}

/* Login Card */

.login-box{

    width:390px;
    padding:45px;
    border-radius:25px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:0 25px 60px rgba(0,0,0,.5);

    position:relative;
    z-index:5;

}

.logo{

    font-size:55px;
    text-align:center;
    margin-bottom:10px;

    animation:float 3s infinite;

}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-10px);
}

}

h2{

    color:white;
    text-align:center;
    margin-bottom:8px;

}

.subtitle{

    color:#bbb;
    text-align:center;
    margin-bottom:35px;
    font-size:14px;

}

.input-box{

    margin-bottom:20px;

}

.input-box label{

    color:#ddd;
    display:block;
    margin-bottom:8px;

}

.input-box input{

    width:100%;
    padding:15px;

    border:none;
    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.1);

    color:white;

    font-size:15px;

}

.input-box input::placeholder{

    color:#999;

}

.options{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
color:#ccc;
font-size:14px;

}

.options a{

text-decoration:none;
color:#ff4444;

}

button{

width:100%;
padding:15px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:17px;
font-weight:600;

background:linear-gradient(45deg,#ff0000,#ff7300);

color:white;

transition:.4s;

}

button:hover{

transform:translateY(-5px);

box-shadow:0 15px 35px rgba(255,0,0,.4);

}

.register{

margin-top:25px;
text-align:center;
color:#aaa;

}

.register a{

color:#ff5555;
text-decoration:none;

}

.quote{

margin-top:30px;
text-align:center;
font-size:13px;
color:#999;
font-style:italic;

}

</style>

</head>
<body>

<div class="login-box">

<div class="logo">
🏋️
</div>

<h2>Welcome Back</h2>

<p class="subtitle">
Train Hard. Stay Strong. Achieve Your Goals.
</p>

<form id="form">
    {% csrf_token %}

<div class="input-box">

<label>Email</label>

<input type="email" placeholder="Enter your email" name="username" id="username">

</div>

<div class="input-box">

<label>Password</label>

<input type="password" placeholder="Enter your password" name="password" id="password">
<br><span id="msg" style="color: red;"></span>



</div>

<div class="options">

<label>
<input type="checkbox">
 Remember Me
</label>
<a href="#">Forgot Password?</a>

</div>
<span id="loginmsg" style="color: red;"></span>
<button type="submit">
LOGIN
</button>

<div class="register">

Don't have an account?
<a href="/myapp/client_signup/">Join Now</a>

</div><br>

<div class="register">

Are You a Trainer?
<a href="/myapp/trainer_signup/">Join Now</a>

</div>

<div class="quote">
"Your only competition is the person you were yesterday."
</div>

</form>

</div>
<script>
    $(document).ready(function(){
        $('#form').submit(function(e){
            e.preventDefault()
            let username=$('#username').val()
            let password=$('#password').val()
            let token = $('input[name=csrfmiddlewaretoken]').val();
            $.ajax({
                url:'/myapp/login_post/',
                method:'POST',
                data:{
                    'username':username,
                    'password':password,
                    'csrfmiddlewaretoken':token
                },success: function(response) {

    if (response.status == 'client') {
        window.location.href = '/myapp/client_home/';
    }
    else if (response.status == 'approve') {
        window.location.href = '/myapp/trainer_home/';
    
    }
    else if (response.status == 'reject') {
        $("#loginmsg").html('sorry admin has rejected your request!')
        
    }
    else if (response.status == 'pend') {
        $("#loginmsg").html('please wait for the admin to verify your profile!')
    }

    else if(response.status=='admin'){
         window.location.href = '/myapp/admin_home/';
    }
    else {
        $('#msg').html('Invalid username or password!');
    }

}
            })

        })

    })
    
</script>
</body>
</html>
